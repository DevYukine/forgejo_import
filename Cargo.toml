[package]
name = "forgejo_import"
version = "0.1.0"
edition = "2024"
authors = ["DevYukine <devyukine@gmx.de>"]
description = "A cli helping you to import/mirror repositories from external services to forgejo"
license = "MIT"

[dependencies]
tokio = { version = "^1.53", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "^0.13.5", features = ["rustls", "http2", "json", "query"], default-features = false }
serde = { version = "^1.0.229", features = ["derive"] }
serde_json = "^1.0.154"
clap = { version = "^4.6.7", features = ["derive"] }
anyhow = "^1.0.104"
env_logger = "^0.11.11"
log = "^0.4.34"
bytes = "^1.12.1"
base64 = "^0.23.1"
