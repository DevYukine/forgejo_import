[package]
name = "forgejo_import"
version = "0.1.0"
edition = "2024"
authors = ["DevYukine <devyukine@gmx.de>"]
description = "A cli helping you to import/mirror repositories from external services to forgejo"
license = "MIT"

[dependencies]
tokio = { version = "^1", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "^0.13", features = ["rustls", "http2", "json", "query"], default-features = false }
serde = { version = "^1", features = ["derive"] }
serde_json = "^1"
clap = { version = "^4.6", features = ["derive"] }
anyhow = "^1.0"
env_logger = "^0.11"
log = "^0.4"
bytes = "^1.12"
base64 = "^0.22"
